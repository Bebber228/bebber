<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Bebber</title>
<link rel="icon" href="img/icons/booruhub.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap">
<style>
/* ===== Шрифты: Segoe WP / Segoe UI с устройства, иначе Open Sans (Google Fonts) ===== */
@font-face{font-family:"WP";font-weight:300;src:local("Segoe WP Light"),local("SegoeWP-Light"),local("Segoe UI Light"),local("SegoeUI-Light")}
@font-face{font-family:"WP";font-weight:400;src:local("Segoe WP"),local("SegoeWP"),local("Segoe UI"),local("SegoeUI")}
@font-face{font-family:"WP";font-weight:600;src:local("Segoe WP Semibold"),local("SegoeWP-Semibold"),local("Segoe UI Semibold"),local("SegoeUI-Semibold")}

:root{
  --accent:#1BA1E2;
  --cols:8;
  --gap:6px;
  --w:min(calc(100vw - 32px),1040px);
  --cell:calc((var(--w) - (var(--cols) - 1) * var(--gap)) / var(--cols));
  --ease:cubic-bezier(.1,.9,.2,1);
}
@media (max-width:640px){:root{--cols:4;--gap:5px;--w:calc(100vw - 20px)}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#000;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
#sbar{position:fixed;right:3px;top:0;width:4px;background:#fff;opacity:0;z-index:55;pointer-events:none;transition:opacity .4s}
#sbar.on{opacity:.45;transition:opacity .1s}
body.locked #shell{visibility:hidden}
body{margin:0;padding:44px 0 40px;background:#000;color:#fff;
  font-family:"WP","Segoe WP","Segoe UI","Open Sans",Tahoma,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  user-select:none;-webkit-user-select:none}
a{color:inherit;text-decoration:none}
a,img{-webkit-user-drag:none;user-drag:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
#shell{width:var(--w);margin:0 auto;position:relative}
#page,#start,#apps{touch-action:pan-y}

/* ===== Строка состояния ===== */
#status{position:fixed;top:0;left:0;right:0;height:28px;background:#000;z-index:50;display:flex;
  justify-content:space-between;align-items:center;padding:0 14px;font-size:13px}
#status .grp{display:flex;gap:9px;align-items:center}
.sig{display:flex;align-items:flex-end;gap:2px;height:12px}
.sig i{display:block;width:3px;background:#fff}
.bat{width:22px;height:11px;border:1.5px solid #fff;position:relative;padding:1.5px}
.bat::after{content:"";position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:#fff}
.bat i{display:block;height:100%;width:100%;background:#fff}
.bat.low i{background:#E51400}
#batPct{font-size:12px}
.bolt{width:9px;height:12px;fill:#fff;display:none}
#batWrap.charging .bolt{display:block}

/* ===== Плитки ===== */
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell);
  gap:var(--gap);grid-auto-flow:dense}
.tile{position:relative;display:block;cursor:pointer;outline:none}
.tile.s{grid-column:span 1;grid-row:span 1}
.tile.m{grid-column:span 2;grid-row:span 2}
.tile.w{grid-column:span 4;grid-row:span 2}
.tile-body{position:absolute;inset:0;overflow:hidden;perspective:900px;transition:transform .12s ease-out}
.tile.flip .tile-body{overflow:visible}
.tile-in{position:absolute;inset:0}
.face{position:absolute;left:0;right:0;top:0;height:100%;background-color:var(--accent);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile.peek .tile-in{bottom:auto;height:200%;transition:transform .9s var(--ease)}
.tile.peek .face{height:50%}
.tile.peek .back{top:50%}
.tile.peek.on .tile-in{transform:translateY(-50%)}
.tile.flip .tile-in{transform-style:preserve-3d;transition:transform .9s var(--ease)}
.tile.flip .face,.tile.flip .face *{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tile.flip .face{transition:visibility 0s linear .07s}
.tile.flip .back,.tile.flip.on .front{visibility:hidden}
.tile.flip.on .back{visibility:visible}
.tile.flip .back{transform:rotateX(180deg)}
.tile.flip.on .tile-in{transform:rotateX(180deg)}
.face.pic{background-size:cover;background-position:center;background-repeat:no-repeat}
.face.pic.glyph{background-size:100%}
.face svg{width:calc(var(--cell) * .72);height:auto;stroke:#fff;fill:none;stroke-width:1.4;stroke-linecap:square}
.label{position:absolute;left:8px;bottom:6px;font-size:14px;line-height:1.1;z-index:2}
.back{flex-direction:column;justify-content:flex-start;align-items:flex-start;padding:10px 12px 28px;text-align:left}
.b-title{font-size:21px;margin-bottom:4px;line-height:1.15}
.b-text{font-size:15px;line-height:1.3;opacity:.92}
.clock{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 12px 10px}
.c-time{font-size:calc(var(--cell) * .95);font-weight:300;line-height:1;letter-spacing:-2px}
.c-day{font-size:calc(var(--cell) * .38);font-weight:300;line-height:1.1}
.c-date{font-size:calc(var(--cell) * .22)}
/* плитка «обо мне»: аватарка опускается наполовину, до конца и снова поднимается */
.ava-slide{position:absolute;left:0;right:0;top:-100%;height:200%;transition:transform 1.1s var(--ease)}
.ava-name{position:absolute;left:0;right:0;top:0;height:50%;background:var(--accent)}
.nick{position:absolute;left:10px;bottom:8px;font-size:calc(var(--cell) * .4);font-weight:300;line-height:1.1}
.ava-pic{position:absolute;left:0;right:0;top:50%;height:50%;background:center/cover no-repeat}
.tile.ava .label{text-shadow:0 0 6px #000a}
.tile.ava[data-stage="1"] .ava-slide{transform:translateY(25%)}
.tile.ava[data-stage="2"] .ava-slide{transform:translateY(50%)}
/* плитка «контакты»: сетка соцсетей */
.face.soc{display:grid;align-items:stretch;justify-items:stretch;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.sc{position:relative;overflow:hidden}
.sc-in{position:absolute;inset:0;background:center/cover no-repeat}
.sc.big{position:absolute;width:calc(200% / 3);height:calc(200% / 3);z-index:1;overflow:visible;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;align-items:stretch;justify-items:stretch}
.sc.big .q{position:relative;overflow:hidden}
.sc.big .q .sc-in{background-size:200% 200%}
.tile.social .label{text-shadow:0 0 6px #000c}
/* стрелка «все приложения» */
.more{display:flex;justify-content:flex-end;margin:24px 0 8px}
.more span{display:block;width:46px;height:46px;border:3px solid #fff;border-radius:50%;
  background:url("img/arrow_right.png") 50% 50%/124% no-repeat}

/* ===== Список приложений ===== */
.search{width:100%;height:42px;border:2px solid transparent;background:#ffffffcc;color:#000;font:inherit;
  font-size:17px;padding:0 10px;outline:none;margin:4px 0 6px;border-radius:0;user-select:text}
.search:focus{background:#fff;border-color:var(--accent)}
.letter{width:52px;height:52px;border:2px solid var(--accent);color:var(--accent);font-size:30px;font-weight:300;
  display:flex;align-items:flex-end;padding:0 0 3px 7px;margin:18px 0 8px;line-height:1}
.app-row{display:flex;align-items:center;gap:14px;padding:5px 0;font-size:22px;width:max-content;max-width:100%}
.app-ico{width:52px;height:52px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.app-ico svg{width:28px;stroke:#fff;fill:none;stroke-width:1.6}
.app-ico img{width:100%;height:100%;object-fit:cover;display:block}
#jump{position:fixed;inset:0;z-index:60;background:#000000d9;overflow-y:auto;scrollbar-width:none;padding:40px 16px}
#jump::-webkit-scrollbar{display:none}
#jump .jl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,440px);margin:0 auto}
#jump button{aspect-ratio:1;font-size:clamp(28px,7vw,40px);font-weight:400;display:flex;align-items:flex-end;padding:0 0 4px 9px;
  background:#1f1f1f;color:#fff;line-height:1;backface-visibility:hidden}
#jump button.has{background:var(--accent)}

/* ===== Страница приложения (pivot) ===== */
.app-title{font-size:15px;font-weight:600;letter-spacing:.6px;margin:6px 0 0}
.pivot-heads{white-space:nowrap;overflow:hidden;margin:0 0 10px -10px;padding:0 0 6px 8px}
.ph{font-size:clamp(44px,7vw,68px);font-weight:300;margin-right:26px;color:#ffffff59;line-height:1.25;letter-spacing:-1px}
.ph.on{color:#fff}
.pivot-body{min-height:60vh}
.li{display:block;padding:8px 0 10px;width:max-content;max-width:100%}
.li-t{font-size:28px;font-weight:300;line-height:1.15;display:block}
.li-s{font-size:15px;color:var(--accent);margin-top:2px;display:block}
.li.pli{display:flex;align-items:center;gap:14px}
.pli .app-ico{width:62px;height:62px}
.about-ico{width:120px;height:120px;margin:4px 0 18px;background:var(--accent);display:flex;align-items:center;justify-content:center;overflow:hidden}
.about-ico img{width:100%;height:100%;object-fit:cover;display:block}
.txt{font-size:19px;line-height:1.45;color:#ddd;max-width:760px;margin:0 0 16px;font-weight:300}
.txt.lead{font-size:27px;color:#fff}
.sub-h{font-size:15px;color:#9a9a9a;margin:18px 0 10px}
.store{display:inline-block;margin:8px 0 6px;min-width:256px;min-height:60px}
.store img{width:256px;max-width:100%;display:block}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:980px}
.shot{display:block;aspect-ratio:9/16;background:#1d1d1d;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;max-width:620px}
.colors button{aspect-ratio:1;border:3px solid transparent}
.colors button.on{border-color:#fff}
.opt{display:block;padding:8px 0 10px}
.opt.on .li-t{color:var(--accent)}
.btn{border:2px solid #fff;padding:6px 20px;font-size:16px;margin-top:10px}
.btn:active{background:#fff;color:#000}
.toggle{display:block;margin:26px 0 0;cursor:pointer}
.t-l{display:block;font-size:15px;color:#9a9a9a;margin-bottom:6px}
.t-r{display:flex;align-items:center;gap:14px}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.sw{width:56px;height:24px;border:2px solid #fff;position:relative;display:block}
.sw::before{content:"";position:absolute;left:3px;top:3px;bottom:3px;width:0;background:var(--accent);transition:width .2s}
.sw::after{content:"";position:absolute;top:-4px;left:-2px;width:12px;height:28px;background:#fff;transition:left .2s}
.toggle input:checked+.sw::before{width:calc(100% - 6px)}
.toggle input:checked+.sw::after{left:42px}
.t-s{font-size:20px;font-weight:300}

/* ===== Просмотр скриншотов ===== */
#viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
#viewer img{max-width:calc(100vw - 24px);max-height:calc(100vh - 70px);display:block}
#viewer .v-cnt{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:15px;color:#9a9a9a}

/* ===== Экран блокировки ===== */
#lock{position:fixed;inset:0;z-index:100;background:#000 center/cover no-repeat;
  touch-action:none;cursor:grab}
.l-clock{position:absolute;left:24px;bottom:44px;text-align:left}
.l-time{font-size:clamp(90px,14vw,150px);font-weight:300;line-height:1;letter-spacing:-3px}
.l-date{font-size:clamp(30px,4vw,44px);font-weight:300;line-height:1.15;margin-top:6px;white-space:pre-line}
#lock::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,#0000 55%,rgba(0,0,0,var(--vignette,.15)))}   /* виньетка: --vignette */
.l-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;opacity:.55}

@media (prefers-reduced-motion:reduce){.tile-in,.tile-body,.ava-slide{transition:none!important}}
</style>
</head>
<body>

<div id="lock" hidden>
  <div class="l-clock"><div class="l-time"></div><div class="l-date"></div></div>
  <div class="l-hint"></div>
</div>

<div id="status">
  <div class="grp"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i><i style="height:12px"></i></span></div>
  <div class="grp">
    <span class="grp" id="batWrap" hidden><span id="batPct"></span><svg class="bolt" viewBox="0 0 9 12"><path d="M6 0L0 7h3.5L2.5 12 9 4.5H5.5z"/></svg><span class="bat"><i></i></span></span>
    <span id="sTime"></span>
  </div>
</div>

<div id="shell">
  <section id="start" hidden>
    <div class="grid" id="tiles"></div>
    <a class="more" href="#/apps" draggable="false"><span class="tilt"></span></a>
  </section>

  <section id="apps" hidden>
    <input class="search ts" id="search" type="search" autocomplete="off">
    <div id="appList"></div>
  </section>

  <section id="page" hidden></section>
</div>

<div id="sbar"></div>
<div id="jump" hidden><div class="jl"></div></div>
<div id="viewer" hidden><img alt=""><div class="v-cnt"></div></div>

};

/* ================= Рабочий стол ================= */

function tileHTML(tl) {
  const label = tl.label ? `<span class="label">${tl.label}</span>` : '';
  let inner;
  if (tl.type === 'social') {
    inner = `<div class="tile-in"><div class="face front soc">${'<div class="sc"></div>'.repeat(9)}<div class="sc big" hidden></div>${label}</div></div>`;
  } else if (tl.type === 'avatar') {
    inner = `<div class="tile-in"><div class="face front"><div class="ava-slide">
      <div class="ava-name"><div class="nick">${CONFIG.name}</div></div>
      <div class="ava-pic" style="background-image:url('${CONFIG.avatar}')">${label}</div></div></div></div>`;
  } else {
    let front, back;

      front = '<div class="clock"><div class="c-time"></div></div>';
      back = '<div class="clock"><div class="c-day"></div><div class="c-date"></div></div>';
    } else {
      front = (tl.img ? '' : svg(tl.icon)) + label;
      back = (tl.feed ? '<div class="feed"></div>' : (tl.back || '')) + label;
    }
    const pic = tl.img ? ` pic${tl.glyph ? ' glyph' : ''}" style="background-image:url('${tl.img}')` : '';
    inner = `<div class="tile-in"><div class="face front${pic}">${front}</div>${tl.live ? `<div class="face back">${back}</div>` : ''}</div>`;
  }
  const cls = `tile ${tl.size} ${tl.live || ''}${tl.type === 'avatar' ? ' ava' : ''}${tl.type === 'social' ? ' social' : ''}`;
  const tag = tl.to ? 'a' : 'div';
  return `<${tag} class="${cls}"${tl.to ? ` href="${tl.to}"` : ''} draggable="false"${tl.feed ? ' data-feed="1"' : ''}${tl.type === 'avatar' ? ' data-stage="0"' : ''}>
    <div class="tile-body tilt">${inner}</div></${tag}>`;
}
function renderTiles() { $('#tiles').innerHTML = TILES().map(tileHTML).join(''); tick(); socialInit(); }

let feedIdx = 0;
function flipTile(el) {
  const on = el.classList.contains('on');
  if (!on && el.dataset.feed) {
    const x = PROJECTS[feedIdx++ % PROJECTS.length];
    $('.feed', el).innerHTML = `<div class="b-title">${x.name}</div><div class="b-text">${tr(x.sub)}</div>`;
  }

}
const startActive = () => cur && cur.kind === 'start' && !document.hidden && $('#lock').hidden && !PAN.on;
(function liveLoop() {
  setTimeout(() => {
    if (startActive()) {
      const list = $$('#start .tile.flip, #start .tile.peek').filter(el => {
        const r = el.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight;
      });
      if (list.length) flipTile(list[Math.random() * list.length | 0]);

    liveLoop();
  }, 1800 + Math.random() * 2600);
})();
// аватарка: целиком → наполовину вниз (видно ник) → до конца вниз → снова вверх
setTimeout((function avaLoop() {
  const st = $('#start .tile.ava');
  const stage = st ? +st.dataset.stage : 0;
  if (st && startActive()) st.dataset.stage = (stage + 1) % 3;
  setTimeout(avaLoop, [5000, 2600, 2600][st ? +st.dataset.stage : 0]);
}), 5000);

/* ================= Плитка «контакты»: сетка 3×3 как в «Людях» WP 8.1 =================
   Ячейки по одной переворачиваются на месте (как плитка «проекты»): иконка соцсети или пустая
   ячейка, затемнённая чёрным на 0, 15, 30 или 45 %. Иногда одна иконка разворачивается на 2×2. */
const SOC = { cells: [], big: null, bigAge: 0 };
const SHADES = [0, 15, 30, 45];
const isBlank = c => /^b\d+$/.test(c);
const randBlank = () => 'b' + SHADES[Math.random() * SHADES.length | 0];
const socHTML = c => isBlank(c) ? `<div class="sc-in" style="background:rgba(0,0,0,${c.slice(1) / 100})"></div>`
  : `<div class="sc-in" style="background-image:url('${socIcon(c)}')"></div>`;
function socRoll(el, c) {                          // переворот вокруг горизонтальной оси
  const old = el.firstElementChild;
  const out = old ? old.animate([{ transform: 'perspective(500px) rotateX(0)' }, { transform: 'perspective(500px) rotateX(90deg)' }],
    { duration: dur(230), easing: 'cubic-bezier(.6,0,1,1)', fill: 'forwards' }).finished : Promise.resolve();
  return out.then(() => {
    el.innerHTML = c ? socHTML(c) : '';
    const nu = el.firstElementChild; if (!nu) return;
    return nu.animate([{ transform: 'perspective(500px) rotateX(-90deg)' }, { transform: 'none' }],
      { duration: dur(420), easing: 'cubic-bezier(0,0,.2,1)' }).finished;
  });
}
function socialInit() {
  const tile = $('#start .tile.social'); if (!tile) return;
  const pool = SOCIAL.map(x => x.id).concat(Array(Math.max(0, 9 - SOCIAL.length)).fill(0).map(randBlank));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
  SOC.cells = pool.slice(0, 9); SOC.big = null;
  $$('.sc:not(.big)', tile).forEach((el, i) => el.innerHTML = socHTML(SOC.cells[i]));
}
function socialStep() {
  const tile = $('#start .tile.social'); if (!tile) return;
  const cells = $$('.sc:not(.big)', tile), big = $('.sc.big', tile);
  const ids = SOCIAL.map(x => x.id);
  const covered = i => {
    if (!SOC.big) return false;
    const dr = Math.floor(i / 3) - SOC.big.r, dc = (i % 3) - SOC.big.c;
    return dr >= 0 && dr <= 1 && dc >= 0 && dc <= 1;
  };
  if (SOC.big) {                                   // большая иконка подержалась — переворачивается обратно
    if (++SOC.bigAge < 3) return socialCell(cells, covered);
    // четверти по очереди переворачиваются обратно в ячейки, которые были под ними
    const under = cells.filter((_, i) => covered(i));
    $$('.q', big).forEach((q, k) => setTimeout(() => {
      const nu = q.firstElementChild;
      nu.animate([{ transform: 'perspective(500px) rotateX(0)' }, { transform: 'perspective(500px) rotateX(90deg)' }],
        { duration: dur(230), easing: 'cubic-bezier(.6,0,1,1)', fill: 'forwards' }).finished.then(() => {
        q.style.visibility = 'hidden';
        const c = under[k].firstElementChild;
        if (c) c.animate([{ transform: 'perspective(500px) rotateX(-90deg)' }, { transform: 'none' }], { duration: dur(420), easing: 'cubic-bezier(0,0,.2,1)' });
        if (k === 3) { big.hidden = true; big.innerHTML = ''; }
      });
    }, dur(k * 110)));
    SOC.big = null; return;
  }
  if (Math.random() < .16) {                       // иконка на 2×2 в случайном углу
    const r = Math.random() * 2 | 0, c = Math.random() * 2 | 0;
    SOC.big = { r, c }; SOC.bigAge = 0;
    const seen = new Set(SOC.cells.filter((_, k) => !covered(k)));   // не дублировать видимые иконки
    const pick = ids.filter(x => !seen.has(x)), id = (pick.length ? pick : ids)[Math.random() * (pick.length || ids.length) | 0];
    SOC.big.id = id;
    Object.assign(big.style, { top: (r * 100 / 3) + '%', left: (c * 100 / 3) + '%' });
    const pos = ['0% 0%', '100% 0%', '0% 100%', '100% 100%'];
    big.innerHTML = pos.map(() => '<div class="q"></div>').join(''); big.hidden = false;
    const under = cells.filter((_, i) => covered(i));
    $$('.q', big).forEach((q, k) => {
      q.style.visibility = 'hidden';
      setTimeout(() => {                             // каждая четверть: ячейка под ней уходит, четверть иконки приходит
        const c = under[k].firstElementChild;
        const out = c ? c.animate([{ transform: 'perspective(500px) rotateX(0)' }, { transform: 'perspective(500px) rotateX(90deg)' }],
          { duration: dur(230), easing: 'cubic-bezier(.6,0,1,1)' }).finished : Promise.resolve();
        out.then(() => {
          q.innerHTML = `<div class="sc-in" style="background-image:url('${socIcon(id)}');background-position:${pos[k]}"></div>`;
          q.style.visibility = '';
          q.firstElementChild.animate([{ transform: 'perspective(500px) rotateX(-90deg)' }, { transform: 'none' }],
            { duration: dur(420), easing: 'cubic-bezier(0,0,.2,1)' });
        });
      }, dur(k * 110));
    });
    return;
  }
  socialCell(cells, covered);
}
function socialCell(cells, covered) {
  const free = cells.map((_, i) => i).filter(i => !covered(i));
  const i = free[Math.random() * free.length | 0], curC = SOC.cells[i];
  const shown = new Set(SOC.cells.filter((c, k) => k !== i && !covered(k)).concat(SOC.big ? [SOC.big.id] : []));
  const icons = SOCIAL.map(x => x.id).filter(id => id !== curC && !shown.has(id));
  let next;
  if (isBlank(curC)) next = Math.random() < .25 || !icons.length ? randBlank() : icons[Math.random() * icons.length | 0];
  else next = Math.random() < .45 || !icons.length ? randBlank() : icons[Math.random() * icons.length | 0];
  if (next === curC) return;
  SOC.cells[i] = next; socRoll(cells[i], next);
}
setTimeout(function socLoop() {
  if (startActive()) socialStep();
  setTimeout(socLoop, 1200 + Math.random() * 1600);
}, 2500);

/* ================= Часы ================= */
function tick() {
  const d = new Date(), time = d.getHours() + ':' + pad(d.getMinutes());
  const loc = L() === 'ru' ? 'ru-RU' : 'en-US';
  const day = d.toLocaleDateString(loc, { weekday: 'long' });
  const date = d.toLocaleDateString(loc, { day: 'numeric', month: 'long' });
  $('#sTime').textContent = time;
  $$('.c-time').forEach(e => e.textContent = time);
  $$('.c-day').forEach(e => e.textContent = L() === 'ru' ? day : day.toLowerCase());
  $$('.c-date').forEach(e => e.textContent = date);
  $('.l-time').textContent = time;
  $('.l-date').textContent = day.toLowerCase() + '\n' + date;
}
setInterval(tick, 1000);

/* ================= Батарея (Battery Status API) ================= */
if (navigator.getBattery) {
  navigator.getBattery().then(b => {
    const wrap = $('#batWrap'), bat = $('.bat');
    const upd = () => {
      const pct = Math.round(b.level * 100);
      $('.bat i').style.width = pct + '%';
      $('#batPct').textContent = pct + '%';
      wrap.classList.toggle('charging', b.charging);
      bat.classList.toggle('low', pct <= 15 && !b.charging);
      wrap.hidden = false;
    };
    upd();
    b.addEventListener('levelchange', upd);
    b.addEventListener('chargingchange', upd);
  }).catch(() => {});
}

/* ================= Список приложений ================= */
let APP_LIST = [];
const letterOf = n => n[0].toLowerCase();
const LAT = [...'abcdefghijklmnopqrstuvwxyz'], CYR = [...'абвгдеёжзийклмнопрстуфхцчшщэюя'];
function renderAppList() {
  APP_LIST = Object.entries(APPS).map(([id, a]) => ({ name: a.title(), icon: a.icon, img: a.img, glyph: a.glyph, to: '#/app/' + id }))
    .sort((a, b) => a.name.localeCompare(b.name, L()));
  let html = '', last = '';
  APP_LIST.forEach(a => {
    const Lt = letterOf(a.name);
    if (Lt !== last) { html += `<button class="letter ts" data-l="${Lt}">${Lt}</button>`; last = Lt; }
    html += `<a class="app-row ts tilt" data-n="${a.name.toLowerCase()}" draggable="false" href="${a.to}"><span class="app-ico">${ico(a)}</span><span>${a.name}</span></a>`;
  });
  $('#appList').innerHTML = html;
  $('#search').value = '';
}
$('#search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  $$('#appList .app-row').forEach(r => r.hidden = q && !r.dataset.n.includes(q));
  $$('#appList .letter').forEach(l => l.hidden = !!q);
});
$('#appList').addEventListener('click', e => {
  if (!e.target.closest('.letter')) return;
  const has = new Set(APP_LIST.map(a => letterOf(a.name)));
  const base = L() === 'ru' ? CYR : LAT, other = L() === 'ru' ? LAT : CYR;
  const alpha = L() === 'ru' ? other.filter(l => has.has(l)).concat(base) : base.concat(other.filter(l => has.has(l)));
  const jl = $('#jump .jl');
  jl.innerHTML = alpha.map(l => `<button class="${has.has(l) ? 'has' : ''}" data-l="${l}">${l}</button>`).join('');
  $('#jump').hidden = false; $('#jump').scrollTop = 0;
  jumpMosaic(true);
});
// мозаика: плитки букв переворачиваются по одной, строка за строкой со случайным разбросом
function jumpMosaic(show) {
  const btns = $$('#jump .jl button');
  const anims = btns.map((b, i) => b.animate(show
    ? [{ transform: 'perspective(600px) rotateX(-90deg)' }, { transform: 'none' }]
    : [{ transform: 'none' }, { transform: 'perspective(600px) rotateX(90deg)' }],
    { duration: dur(show ? 260 : 170), delay: dur(Math.floor(i / 4) * (show ? 28 : 16) + Math.random() * (show ? 70 : 50)),
      easing: show ? 'cubic-bezier(0,0,.2,1)' : 'cubic-bezier(.6,0,1,1)', fill: 'both' }));
  return Promise.all(anims.map(a => a.finished)).then(() => anims, () => anims);
}
let jumpClosing = false;
function closeJump(letter) {
  if ($('#jump').hidden || jumpClosing) return;
  jumpClosing = true;
  jumpMosaic(false).then(anims => {
    $('#jump').hidden = true; anims.forEach(a => a.cancel()); jumpClosing = false;
    if (letter) { const el = $(`#appList .letter[data-l="${letter}"]`); if (el) scrollTo(0, el.getBoundingClientRect().top + scrollY - 40); }
  });
}
$('#jump').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && !b.classList.contains('has')) return;
  closeJump(b && b.dataset.l);
});

function velocity(d, e) {                       // px/мс по последним ~100 мс
  track(d, e);

  let d = null;

    if (e.button > 0 || e.target.closest('input, #jump, #viewer')) return;
    const ok = start(e); if (!ok) return;

    if (!d) return;

      if (typeof d.ok === 'function' && !d.ok(dx)) return;   // недопустимое направление
      d.active = true; d.x = e.clientX; release(); move(d, 0, true);

    track(d, e);
    move(d, e.clientX - d.x, false);

    if (!d) return; const s = d; d = null;
    if (!s.active) return;

    end(s, e.clientX - s.x, velocity(s, e));

  document.addEventListener('pointercancel', up);
}

// свайп между вкладками pivot: контент едет за курсором
(() => {
  const page = $('#page');
  let busy = false;
  const parts = () => [$('.pivot-body', page), $('.pivot-heads', page)];
  hDrag(
    e => cur && cur.kind === 'app' && !busy && page._app && page.contains(e.target),
    (d, x) => {
      if (page._app.pivots.length < 2) x *= .25;         // одна вкладка — пружинит
      d.dx = x;
      const [b, h] = parts();
      b.style.transform = `translateX(${x}px)`;
      h.style.transform = `translateX(${x * .6}px)`;

    async (d, x, v) => {
      const n = page._app.pivots.length, W = innerWidth, [b, h] = parts();
      const dx = d.dx || 0;

        const a2 = h.animate([{ transform: `translateX(${dx * .6}px)`, opacity: 1 }, { transform: `translateX(${-dir * W * .3}px)`, opacity: 0 }], opt);

/* ================= Анимация «турникет» (Turnstile, как в WP 8.1) =================
   Все элементы поворачиваются вокруг ОДНОЙ оси — левого края экрана — с общей точкой
   перспективы, по очереди сверху вниз («перо»). Вперёд: старая страница уходит вглубь,
   новая выворачивается навстречу. Назад — в обратную сторону. Нажатая плитка уходит последней. */
/* Турникет — всё снято покадрово с видео Lumia (30 к/с). Ось вращения — левый край экрана,
   точка перспективы — центр экрана по высоте. «Вглубь» = правый край уходит от зрителя (элемент
   уменьшается), «на зрителя» = правый край идёт к нам (элемент растёт и разъезжается от центра).
   out-fwd  открываем приложение: элементы по одному СНИЗУ ВВЕРХ поворачиваются вокруг ПРАВОГО края —
            левый край (иконка) выходит на зрителя, поэтому элемент уезжает влево, а верхние ещё и вверх;
            нажатый стоит на месте и пропадает последним;
   in-fwd   страница приложения: элементы СВЕРХУ ВНИЗ быстро доворачиваются ИЗ ГЛУБИНЫ на место;
   out-back выходим назад: элементы СВЕРХУ ВНИЗ уходят ВГЛУБЬ;
   in-back  возвращаемся в список: элементы СНИЗУ ВВЕРХ возвращаются тем же поворотом, но не с самого конца, а проявляясь;
   tiles    рабочий стол: плитки ряд за рядом СНИЗУ ВВЕРХ вылетают ИЗ ГЛУБИНЫ и встают на место. */
const TURN = {
  'out-fwd':  { up: true,  step: 33, dur: 110, from: 0,  to: 22,  cut: .8, ease: 'cubic-bezier(.4,0,1,1)', extra: 100, right: true },
  'in-fwd':   { up: false, step: 30, dur: 170, from: 45, to: 0,   ease: 'cubic-bezier(0,0,.2,1)' },
  'out-back': { up: false, step: 30, dur: 130, from: 0,  to: 50,  cut: .7, ease: 'cubic-bezier(.5,0,1,1)' },
  'in-back':  { up: true,  step: 30, dur: 260, from: -28, to: 0, ease: 'cubic-bezier(0,0,.2,1)' },   // тот же поворот, но с полпути и с проявлением
  'tiles':    { up: true,  step: 32, dur: 360, from: 70, to: 0,   ease: 'cubic-bezier(.1,.9,.2,1)' }
};
function turnstile(els, mode, first) {
  // ось — у левого края колонки контента (как левый край экрана телефона), перспектива по ширине колонки
  const H = innerHeight, sh = $('#shell').getBoundingClientRect(), P = Math.max(700, sh.width * 1.3), c = TURN[mode];
  const axis = c.right ? Math.min(innerWidth, sh.right + 14) : Math.max(0, sh.left - 14);
  const vis = els.filter(el => { if (el.hidden || !el.getClientRects().length) return false; const r = el.getBoundingClientRect(); return r.bottom >= 0 && r.top < H; });
  const rects = new Map(vis.map(el => [el, el.getBoundingClientRect()]));
  vis.sort((a, b) => { const ra = rects.get(a), rb = rects.get(b); return (Math.round(ra.top / 8) - Math.round(rb.top / 8)) || (ra.left - rb.left); });
  const rot = a => `perspective(${P}px) rotateY(${a}deg)`;
  const kf = c.flat ? [{ opacity: 0 }, { opacity: 1 }]
    : c.cut ? [{ transform: rot(c.from), opacity: 1 }, { opacity: 1, offset: c.cut }, { transform: rot(c.to), opacity: 0 }]
    : [{ transform: rot(c.from), opacity: 0 }, { opacity: 1, offset: .3 }, { transform: rot(c.to), opacity: 1 }];
  // номер ряда: элементы одного ряда идут вместе
  const rows = new Map(); let row = -1, lastTop = null;
  vis.forEach(el => { if (el === first) return; const r = rects.get(el);
    if (lastTop === null || Math.abs(r.top - lastTop) > 8) { row++; lastTop = r.top; } rows.set(el, row); });
  const maxRow = row;
  const anims = vis.map(el => {
    const r = rects.get(el);
    el.style.transformOrigin = `${axis - r.left}px ${H / 2 - r.top}px`;
    const k = rows.has(el) ? (c.up ? maxRow - rows.get(el) : rows.get(el)) : 0;
    const delay = el === first && c.extra ? Math.min(maxRow, 14) * c.step + c.extra : Math.min(k, 14) * c.step;
    if (el === first && c.extra) return el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur(50), delay: dur(delay), fill: 'both' });
    return el.animate(kf, { duration: dur(c.dur), delay: dur(delay), easing: c.ease, fill: 'both' });
  });
  return Promise.all(anims.map(a => a.finished)).then(() => anims, () => anims);
}
const pause = ms => new Promise(r => setTimeout(r, dur(ms)));

/* ================= Навигация ================= */
const views = { start: $('#start'), apps: $('#apps'), app: $('#page') };
const items = v => v.kind === 'start' ? $$('#start .tile, #start .more')
  : v.kind === 'apps' ? $$('#apps .ts') : $$('#page .ts');
function parse() {
  const h = location.hash;
  if (h === '#/apps') return { kind: 'apps' };
  const m = h.match(/^#\/app\/(\w+)/);
  if (m && APPS[m[1]]) return { kind: 'app', id: m[1] };
  return { kind: 'start' };
}
let cur = null, lastTap = null;
const scrolls = { start: 0, apps: 0 };
const hist = [];
const hideAll = () => Object.values(views).forEach(v => v.hidden = true);

async function go(v) {
  const old = cur;
  if (old && old.kind === v.kind && old.id === v.id) return;
  const key = v.kind + (v.id || '');
  const isBack = hist.length > 1 && hist[hist.length - 2] === key;
  if (hist.length > 1 && hist[hist.length - 2] === key) hist.pop(); else hist.push(key);
  cur = v;
  closeViewer();
  if (!old) { hideAll(); if (v.kind === 'app') buildPage(v.id); views[v.kind].hidden = false; return; }
  $('#jump').hidden = true;

  if (old.kind !== 'app' && v.kind !== 'app') {           // пуск ⇄ список: панорама
    if (PAN.done) { PAN.done = false; return; }            // уже пролистали пальцем/мышью
    scrolls[old.kind] = scrollY;
    await panAnimate(old.kind, v.kind);
    return;
  }
  if (old.kind !== 'app') scrolls[old.kind] = scrollY;
  // вперёд — когда открываем приложение; из приложения в приложение — тоже вперёд
  const fwd = v.kind === 'app' && !isBack;
  const outs = await turnstile(items(old), fwd ? 'out-fwd' : 'out-back', fwd ? lastTap : null);
  hideAll(); outs.forEach(a => a.cancel());
  await pause(60);                                   // пауза — до показа, чтобы содержимое не мелькало
  if (v.kind === 'app') buildPage(v.id);

  scrollTo(0, v.kind === 'app' ? 0 : scrolls[v.kind]);
  const ins = await turnstile(items(v), v.kind === 'start' ? 'tiles' : fwd ? 'in-fwd' : 'in-back');

/* ================= Панорама: пуск ⇄ все приложения (как в WP 8.1) =================
   Оба экрана стоят рядом; экран перелистывается целиком до конца и плавно тормозит. */
const PAN = { on: false, p: 0, done: false, raf: 0 };
const easeOutExpo = x => x >= 1 ? 1 : (1 - Math.pow(2, -10 * x)) / (1 - Math.pow(2, -10));
function panSet(p) {
  PAN.p = p;

  views.apps.style.transform = `translate3d(${p + innerWidth}px,0,0)`;
}
function panBegin(from) {
  if (PAN.on) return;
  PAN.on = true;
  scrolls[from] = scrollY;
  const left = $('#shell').getBoundingClientRect().left;
  const top0 = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
  ['start', 'apps'].forEach(k => {
    const el = views[k];
    el.hidden = false;
    Object.assign(el.style, { position: 'fixed', left: left + 'px', width: 'var(--w)',
      top: (top0 - scrolls[k]) + 'px', willChange: 'transform' });

}
// v — скорость отпускания (px/мс): быстрый бросок долетает быстрее, затем торможение
function panRun(target, v = 0) {
  cancelAnimationFrame(PAN.raf);
  const p0 = PAN.p, dist = target - p0;
  if (!dist || REDUCED) { panSet(target); return Promise.resolve(); }
  // у экспоненты начальная скорость ≈ 6.9·dist/T — подбираем T под скорость броска
  let T = Math.abs(v) > .05 ? 6.9 * Math.abs(dist) / Math.abs(v) : 700;
  T = Math.max(380, Math.min(T, 800));
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / T);
      panSet(p0 + dist * easeOutExpo(k));
      if (k < 1) PAN.raf = requestAnimationFrame(step); else res();
    };
    PAN.raf = requestAnimationFrame(step);
  });
}
function panEnd(to) {
  ['start', 'apps'].forEach(k => {
    const el = views[k];
    Object.assign(el.style, { position: '', left: '', width: '', top: '', willChange: '', transform: '' });
    el.hidden = k !== to;
  });
  document.documentElement.style.overflow = '';
  scrollTo(0, scrolls[to]);
  PAN.on = false;
}
async function panAnimate(from, to) {
  panBegin(from);
  await panRun(to === 'apps' ? -innerWidth : 0);
  panEnd(to);
}
hDrag(
  () => cur && (cur.kind === 'start' || cur.kind === 'apps') && !PAN.on && lock.hidden && $('#jump').hidden
    && (cur.kind === 'start' ? dx => dx < 0 : dx => dx > 0),
  (d, x, first) => {
    if (first) { d.kind = cur.kind; panBegin(cur.kind); d.base = PAN.p; return; }
    panSet(Math.max(-innerWidth, Math.min(0, d.base + x)));

  async (d, x, v) => {
    const W = innerWidth, toApps = d.kind === 'start';
    const progress = toApps ? -PAN.p : W + PAN.p;        // сколько уже пролистано
    const vDir = toApps ? -v : v;                          // скорость в сторону перехода
    const commit = vDir > .3 || (progress > W * .25 && vDir > -.2);
    const target = (commit === toApps) ? -W : 0;
    await panRun(target, v);
    panEnd(target ? 'apps' : 'start');
    if (commit) { PAN.done = true; if (toApps) location.hash = '#/apps'; else back(); }
  });

document.addEventListener('keydown', e => {
  if (!lock.hidden) { unlock(0); return; }
  if (vw) {
    if (e.key === 'ArrowLeft') showShot(vw.k - 1, -1);
    else if (e.key === 'ArrowRight') showShot(vw.k + 1, 1);
    else if (e.key === 'Escape' || e.key === 'Backspace') closeViewer();
    return;
  }

  if (e.key === 'Escape' || (e.key === 'Backspace' && !typing)) {
    if (!$('#jump').hidden) { closeJump(); return; }
    e.preventDefault(); back();

    if (dy < -60 || Math.abs(dy) < 6) unlock(dy);
    else { lock.style.transition = 'transform .3s cubic-bezier(.1,.9,.2,1)'; lock.style.transform = ''; }
  };
  lock.addEventListener('pointerup', end);
  lock.addEventListener('pointercancel', end);
})();

/* ================= Старт ================= */
applyLang();
go(parse());
if (store.get('lock', CONFIG.lockScreen) && cur.kind === 'start') { lock.hidden = false; document.body.classList.add('locked'); }
else intro();
})();
</script>
